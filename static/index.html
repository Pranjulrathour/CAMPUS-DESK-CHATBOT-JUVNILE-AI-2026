<!doctype html>
<!-- Chat page: a student types a handbook question and sees the answer with its page number. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Doubt Desk</title>
<style>
  :root { --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --muted:#5b6475; --brand:#2f5bea; --line:#dde2ec; --warn:#fff6e5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink);
         display: flex; flex-direction: column; overflow-x: hidden; }
  header { background: var(--brand); color: #fff; padding: 12px 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .9; }
  main { flex: 1; overflow-y: auto; padding: 12px 16px; width: 100%; max-width: 720px; margin: 0 auto; }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--brand); color: var(--brand); background: #fff; border-radius: 16px; padding: 6px 12px;
          font-size: 14px; cursor: pointer; text-align: left; max-width: 100%; }
  .msg { margin: 8px 0; padding: 10px 12px; border-radius: 12px; max-width: 90%; width: fit-content;
         overflow-wrap: anywhere; line-height: 1.45; font-size: 15px; white-space: pre-line; }
  .user { background: var(--brand); color: #fff; margin-left: auto; }
  .bot { background: var(--card); border: 1px solid var(--line); }
  .thinking { color: var(--muted); font-style: italic; }
  .page { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--brand); }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .contact { background: var(--warn); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 14px; white-space: normal; }
  .contact div { margin: 2px 0; }
  .contact a { color: var(--ink); }
  .ask-office { display: inline-block; margin-top: 8px; background: var(--brand); color: #fff !important;
                text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  .votes { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); white-space: normal; }
  .votes button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  footer { background: #fff; border-top: 1px solid var(--line); }
  form { display: flex; gap: 8px; padding: 10px 16px; width: 100%; max-width: 720px; margin: 0 auto; }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .send { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
  button:disabled, input:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Campus Doubt Desk</h1>
  <p>Answers from the student handbook, with the page number.</p>
</header>

<main id="chat">
  <div class="hint">Try one of these:</div>
  <div class="suggest" id="suggest"></div>
</main>

<footer>
  <form id="form" autocomplete="off">
    <input id="q" type="text" maxlength="500" placeholder="Ask about attendance, fees, exams..." aria-label="Your question">
    <button class="send" id="send" type="submit">Send</button>
  </form>
</footer>

<script>
  // When this page is served on its own (port 5500), send API calls to the backend on port 8000.
  const API = location.port === "5500" ? `${location.protocol}//${location.hostname}:8000` : "";
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const sendBtn = document.getElementById("send");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function setBusy(busy) {
    input.disabled = busy;
    sendBtn.disabled = busy;
    document.querySelectorAll(".chip").forEach(c => c.disabled = busy);
  }

  async function loadSuggested() {
    const list = await (await fetch(API + "/api/suggested")).json();
    const box = document.getElementById("suggest");
    list.forEach(q => {
      const b = el("button", "chip", q);
      b.type = "button";
      b.onclick = () => ask(q);
      box.appendChild(b);
    });
  }

  function contactCard(c) {
    const card = el("div", "contact");
    card.appendChild(el("div", null, "Contact the " + (c.office || "college office")));
    if (c.phone) card.appendChild(el("div", null, "📞 " + c.phone));
    if (c.email) {
      const line = el("div", null, "✉️ ");
      const a = el("a", null, c.email);
      a.href = "mailto:" + c.email;
      line.appendChild(a);
      card.appendChild(line);
    }
    if (c.location) card.appendChild(el("div", null, "📍 " + c.location));
    if (c.hours) card.appendChild(el("div", null, "🕘 " + c.hours));
    return card;
  }

  function votes() {
    const box = el("div", "votes");
    box.appendChild(el("span", null, "Did this help?"));
    const send = async (vote) => {
      box.textContent = "Thanks for your feedback!";
      try {
        await fetch(API + "/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ vote }) });
      } catch (e) { /* feedback is optional */ }
    };
    const up = el("button", null, "👍 Yes, this helped");
    const down = el("button", null, "👎 No");
    up.type = down.type = "button";
    up.onclick = () => send("up");
    down.onclick = () => send("down");
    box.append(up, down);
    return box;
  }

  function renderAnswer(d) {
    const box = el("div", "msg bot");
    box.appendChild(el("div", null, d.answer));
    if (d.page) box.appendChild(el("div", "page", "📄 Handbook page " + d.page));
    if (d.contact) box.appendChild(contactCard(d.contact));
    if (d.ask_office_link) {
      const a = el("a", "ask-office", "✉️ Ask the office");
      a.href = d.ask_office_link;
      box.appendChild(a);
    }
    box.appendChild(el("div", "note", d.disclaimer));
    if (d.type === "answer") box.appendChild(votes());
    return box;
  }

  async function ask(question) {
    question = question.trim();
    if (!question) return;
    chat.appendChild(el("div", "msg user", question));
    input.value = "";
    setBusy(true);
    const thinking = el("div", "msg bot thinking", "Thinking...");
    chat.appendChild(thinking);
    scrollDown();
    try {
      const res = await fetch(API + "/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ question }) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      thinking.replaceWith(renderAnswer(await res.json()));
    } catch (e) {
      thinking.classList.remove("thinking");
      thinking.textContent = "Sorry, something went wrong. Please try again, or contact the college office.";
    }
    setBusy(false);
    scrollDown();
    input.focus();
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  loadSuggested();
</script>
</body>
</html>
